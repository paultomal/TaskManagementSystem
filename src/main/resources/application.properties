spring.application.name=demo

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanager
spring.datasource.username=postgres
spring.datasource.password=121212
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Logging =====
# Silence Hibernate SQL statements at runtime.
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
# Don't log handled exceptions (validation 400s, duplicate 409s, etc.) as WARN.
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== JWT =====
# Base64-encoded secret (>= 256 bits). Override in production.
app.jwt.secret=b3ZlcnJpZGUtdGhpcy1zZWNyZXQtd2l0aC1hLXByb3Blci0yNTYtYml0LWtleS12YWx1ZQ==
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# ===== Bootstrap admin (created on startup if no ADMIN exists) =====
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=admin123
