# ===== Test profile: in-memory H2, no external infrastructure required =====
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis connection is created lazily by Lettuce, so no server is needed for
# the context to load. Point at localhost defaults for completeness.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===== JWT (test values) =====
app.jwt.secret=b3ZlcnJpZGUtdGhpcy1zZWNyZXQtd2l0aC1hLXByb3Blci0yNTYtYml0LWtleS12YWx1ZQ==
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# ===== Bootstrap admin =====
app.admin.username=admin
app.admin.email=admin@example.com
app.admin.password=admin123
